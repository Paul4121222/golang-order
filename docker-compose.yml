services:
  postgres:
    image: postgres:17
    container_name: order-postgres
    environment:
      POSTGRES_USER: paul
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: orderdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
